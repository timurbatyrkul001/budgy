name: kopilka_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  riverpod_annotation: ^4.0.2
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  timezone: ^0.11.0
  firebase_crashlytics: ^5.2.7
  firebase_app_check: ^0.4.6
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/brand/
    - assets/icon/

# Budgy app ikonu config'i flutter_launcher_icons.yaml dosyasında.

# Budgy açılış (splash) ekranı — yeşil zemin + beyaz monoline zarf.
flutter_native_splash:
  color: "#0F9E6C"
  image: assets/icon/budgy_splash.png
  android_12:
    color: "#0F9E6C"
    image: assets/icon/budgy_splash.png
  ios: true
  android: true
