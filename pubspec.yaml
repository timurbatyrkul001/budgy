name: kopilka_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  riverpod_annotation: ^4.0.2
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  timezone: ^0.11.0
  firebase_crashlytics: ^5.2.7
  firebase_app_check: ^0.4.8
  speech_to_text: ^7.4.0
  flutter_animate: ^4.5.2
  cloud_functions: ^6.5.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/brand/
    - assets/icon/
  # Onboarding karşılama afişi: Inter Display (başlık/rozet/düğme), Inter
  # (gövde), Caveat (el yazısı not — değişken font, ağırlık fontVariations ile).
  fonts:
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Black.ttf
          weight: 900
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        # Inter'in metin kesiminde elimizde yalnız Regular var. Kalın
        # ağırlıklar tanımlı olmayınca Flutter 400'e düşüyor ve w600 isteyen
        # her başlık inceliyordu. Aynı ailenin display kesimlerini bu iki
        # ağırlığa bağlıyoruz: optik boy farkı gövde puntosunda görünmüyor,
        # eksik ağırlık ise göze batıyordu.
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Black.ttf
          weight: 900
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf

# Budgy app ikonu config'i flutter_launcher_icons.yaml dosyasında.

# Budgy açılış (splash) ekranı — siyah zemin + beyaz monoline zarf.
# Zemin uygulamanın kâğıdıyla (Ex.bg #FBFAF7) aynı: açılıştan ana
# ekrana geçerken renk sıçraması olmuyor.
flutter_native_splash:
  color: "#FBFAF7"
  image: assets/icon/budgy_splash.png
  android_12:
    color: "#FBFAF7"
    image: assets/icon/budgy_splash.png
  ios: true
  android: true
